$kind: http-request
url: "{{base_url}}/api/health"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200 or 503", function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 503]);
      });
      pm.test("Has status field", function () {
        const res = pm.response.json();
        pm.expect(res.status).to.exist;
        pm.expect(res.status).to.be.oneOf(["ok", "degraded"]);
      });
      pm.test("Has services object", function () {
        const res = pm.response.json();
        pm.expect(res.services).to.exist;
        pm.expect(res.services.firebase).to.be.oneOf(["connected", "error"]);
      });
      pm.test("Has timestamp", function () {
        const res = pm.response.json();
        pm.expect(res.timestamp).to.exist;
      });
    language: text/javascript
order: 1000
