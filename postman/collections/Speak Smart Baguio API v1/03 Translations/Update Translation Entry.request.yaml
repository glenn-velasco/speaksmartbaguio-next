$kind: http-request
url: "{{base_url}}/api/v1/translations"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"id":"{{translations_id}}","english":"Updated
    english","ilokano":"Updated ilokano","tagalog":"Updated tagalog"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", function () {
        pm.response.to.have.status(200);
      });
    language: text/javascript
order: 4000
