$kind: http-request
url: "{{base_url}}/api/v1/dictionary"
method: GET
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: pm.request.headers.remove('x-api-key');
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Status 403 Forbidden", function () {
        pm.response.to.have.status(403);
      });
    language: text/javascript
order: 2000
