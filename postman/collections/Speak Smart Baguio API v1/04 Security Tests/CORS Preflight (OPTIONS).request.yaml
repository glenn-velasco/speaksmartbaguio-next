$kind: http-request
url: "{{base_url}}/api/v1/dictionary"
method: OPTIONS
headers:
  Origin: http://localhost:3000
  Access-Control-Request-Method: POST
  Access-Control-Request-Headers: x-api-key, Content-Type
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 204 No Content", function () {
        pm.response.to.have.status(204);
      });
      pm.test("Has CORS headers", function () {
        pm.response.to.have.header("Access-Control-Allow-Methods");
        pm.response.to.have.header("Access-Control-Allow-Headers");
        pm.response.to.have.header("Access-Control-Max-Age");
      });
    language: text/javascript
order: 3000
