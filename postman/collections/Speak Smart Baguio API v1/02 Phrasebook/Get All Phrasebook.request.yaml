$kind: http-request
url: "{{base_url}}/api/v1/phrasebook?limit=10"
method: GET
queryParams:
  limit: "10"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", function () {
        pm.response.to.have.status(200);
      });
      pm.test("Response shape correct", function () {
        const res = pm.response.json();
        pm.expect(res.data).to.be.an("array");
        pm.expect(res.hasMore).to.exist;
      });
    language: text/javascript
order: 2000
