$kind: http-request
url: "{{base_url}}/api/v1/phrasebook"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"id":"{{phrasebook_id}}","ilokanoWord":"updated_phrase","englishTranslation":"Updated
    phrase English","tagalogTranslation":"Updated phrase
    Tagalog","partOfSpeech":"phrase","tts_url":"https://example.com/tts/updated"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", function () {
        pm.response.to.have.status(200);
      });
    language: text/javascript
order: 3000
