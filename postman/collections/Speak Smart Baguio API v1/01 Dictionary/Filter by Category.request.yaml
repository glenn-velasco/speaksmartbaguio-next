$kind: http-request
url: "{{base_url}}/api/v1/dictionary?category={{dictionary_category}}"
method: GET
queryParams:
  category: "{{dictionary_category}}"
scripts:
  - type: afterResponse
    code: >-
      pm.test("Status 200", function () {
        pm.response.to.have.status(200);
      });

      pm.test("All results match category filter", function () {
        const res = pm.response.json();
        const expectedCategory = pm.collectionVariables.get("dictionary_category") || "test_cat";
        res.data.forEach(function(item) {
          pm.expect(item.category).to.eql(expectedCategory);
        });
      });

      pm.test("At least one result", function () {
        const res = pm.response.json();
        pm.expect(res.data.length).to.be.above(0);
      });
    language: text/javascript
order: 4000
