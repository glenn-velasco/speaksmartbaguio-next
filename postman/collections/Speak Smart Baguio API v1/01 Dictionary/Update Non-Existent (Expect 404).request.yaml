$kind: http-request
url: "{{base_url}}/api/v1/dictionary"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"id":"nonexistent_id_12345","ilokanoWord":"test","englishTranslation":"test","tagalogTranslation":"test","partOfSpeech":"noun","category":"test","tts_url":"https://example.com"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 404", function () {
        pm.response.to.have.status(404);
      });
      pm.test("Error has NOT_FOUND code", function () {
        const res = pm.response.json();
        pm.expect(res.code).to.eql("NOT_FOUND");
      });
    language: text/javascript
order: 6000
