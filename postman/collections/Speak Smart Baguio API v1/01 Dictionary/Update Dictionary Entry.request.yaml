$kind: http-request
url: "{{base_url}}/api/v1/dictionary"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"id":"{{dictionary_id}}","ilokanoWord":"updated_word","englishTranslation":"Updated
    English","tagalogTranslation":"Updated
    Tagalog","partOfSpeech":"verb","category":"updated_cat","tts_url":"https://example.com/tts/updated"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", function () {
        pm.response.to.have.status(200);
      });
      pm.test("Response has success message", function () {
        const res = pm.response.json();
        pm.expect(res.data.message).to.exist;
      });
    language: text/javascript
order: 5000
